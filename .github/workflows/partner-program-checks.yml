name: Partner program checks

on:
  push:
    branches:
      - feature/partners-program
  pull_request:
    branches:
      - main

jobs:
  syntax-and-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/js/script.js
          node --check public/js/partner-dashboard.js
          node --check public/js/paw-upgrade.js
          node --check public/js/service-details.js
      - name: Run partner integration test
        run: node --test tests/partner-program.test.js
