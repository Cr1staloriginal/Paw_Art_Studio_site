name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm run security:audit
      - run: npm test
      - run: npm audit --audit-level=high
