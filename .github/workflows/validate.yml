name: Validate JavaScript

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ru-en-and-security

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server.js
      - name: Check browser JavaScript syntax
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
